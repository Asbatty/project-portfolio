  <script>
  window.RECIPE_DATA = {
    /* "recipe" or "idea" */
    "type": "recipe",
    "title": "RECIPE NAME",
    "subtitle": "ONE-LINE DESCRIPTION OR ORIGIN STORY.",
    "source": "WHOSE HANDWRITING / WHERE IT CAME FROM",
    "category": "CATEGORY",
    "yield": "SERVINGS OR QUANTITY",
    /* Path to the original photo, e.g. "originals/my-recipe.jpg" — or null */
    "original": null,

    /* RECIPES: one entry per iteration. Append a new object when the recipe changes;
       the page gets a dropdown to view old builds with changes highlighted. */
    "versions": [
      {
        "version": 1,
        "date": "2026-08",
        "ingredients": ["INGREDIENT 1", "INGREDIENT 2"],
        "directions": ["STEP 1", "STEP 2"],
        "notes": "MARGIN NOTES / COMMENTARY FROM THE ORIGINAL (or empty string)"
      }
    ],

    /* IDEAS: use type "idea", delete "versions"/"yield", and use body instead:
    "body": ["Paragraph 1 of the note.", "Paragraph 2."],
    */

    /* Cook's Log — dated comments. Append entries over time. */
    "log": [
      /* { "date": "2026-08-14", "text": "Tried it with brown butter — better." } */
    ]
  };
  </script>
