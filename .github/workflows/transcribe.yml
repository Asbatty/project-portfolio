name: Transcribe recipe photos

# Fires whenever photos are pushed into recipes/_inbox/ (from any device —
# github.com "Add file → Upload files" in a mobile browser, or git push).
on:
  push:
    branches: [main]
    paths:
      - "recipes/_inbox/**"

permissions:
  contents: write

jobs:
  transcribe:
    # Skip the bot's own commits
    if: ${{ !contains(github.event.head_commit.message, '[skip transcribe]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Transcribe inbox photos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Model used for transcription. Sonnet handles messy handwriting far better
          # than Haiku; the cost difference is a few cents per batch.
          TRANSCRIBE_MODEL: claude-sonnet-4-5
        run: python3 scripts/transcribe_inbox.py

      - name: Commit generated pages
        run: |
          git config user.name "recipe-box-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Transcribe recipe photos [skip transcribe]"
          git push
